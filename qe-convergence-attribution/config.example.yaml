# Example configuration for qe-convergence-attribution (shared qe_bench_core schema).
root: ..
qe:
  bin_dir: /path/to/qe-install-cpu/bin
  gpu_bin_dir: /path/to/qe-install-gpu/bin
  libxc_bin_dir: /path/to/qe-install-cpu-libxc/bin
  mpirun: mpirun
  nvhpc_root: ""
  conda_lib: ""
  mpi_np: 1
  omp_num_threads: 8
pseudo:
  sssp_efficiency: pseudos/sssp/upf
  sssp_precision: pseudos/sssp/upf_precision
  sssp_efficiency_json: pseudos/sssp/SSSP_1.3.0_PBE_efficiency.json
  sssp_precision_json: pseudos/sssp/SSSP_1.3.0_PBE_precision.json
  pseudodojo: pseudos/pseudodojo
datasets:
  wbm: /path/to/matbench-discovery/data/wbm
  mptraj: /path/to/MPtrj_2022.9_full.json
output:
  work_dir: runs
  results_dir: runs/results
