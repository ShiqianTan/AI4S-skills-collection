# Example configuration for qe-powder-raman.
#
# Copy to config.yaml and edit. Every key is optional; missing keys fall back
# to data/defaults.yaml (merged in scripts/qe_common.py).
#
# Priority (highest first): CLI flag > this YAML > environment variable > default.

# --- QE binaries -----------------------------------------------------------
# Portable option: leave commented and set QE_BIN in the environment, or pass
# --bin-dir on the command line. The example below points at a local build.
# bin_dir: /Users/shiqian/Desktop/HefeiAILab/quantum_espresso/q-e/install_cpu/bin

# --- Pseudopotentials (default: bundled pseudo/ directory) -----------------
# pseudo_dir: /path/to/my/pseudopotentials
# Bundled PBE NC (phonon/IR only; QE lraman rejects GGA):
# pseudo_dir: /path/to/qe-powder-raman/pseudo/pbe
# raman: false

# --- SCF -------------------------------------------------------------------
ecutwfc: 60.0          # Ry (wavefunction cutoff)
ecutrho: 240.0         # Ry (charge-density cutoff; 4 x ecutwfc for NC)
conv_thr: 1.0e-10
mixing_beta: 0.5
occupations: fixed     # Raman MVP requires an insulating (gapped) system

# --- ph.x ------------------------------------------------------------------
tr2_ph: 1.0e-14
# Raman response. QE lraman supports LDA only; set false for GGA/PBE
# pseudopotentials (phonon + IR + dielectric, no Raman activity).
raman: true

# --- Spectrum --------------------------------------------------------------
fwhm: 8.0              # cm^-1 broadening (must be > 0)
temperature: 300.0     # K (optional Stokes spectrum; must be >= 0)
laser_wavelength: 532.0  # nm (optional Stokes spectrum; must be > 0)
spectrum_broadening: lorentzian   # lorentzian | gaussian
spectrum_ir: true       # write spectrum_ir + Raman/IR joint plot
spectrum_lo: true       # write one spectrum per requested LO direction

# --- k-point mesh (automatic; density in units of reciprocal Angstrom) -----
kpt_density: 30.0

# --- LO-TO directions (optional). Empty = TO-only powder Raman. ------------
# Each entry is a 3-component Cartesian vector, finite and non-zero.
# lo_to_directions:
#   - [1, 0, 0]       # e.g. zincblende (cubic, any direction)
#   - [0, 0, 1]       # e.g. wurtzite q || c
#   - [1, 0, 0]       # e.g. wurtzite q perpendicular to c

# --- Run control -----------------------------------------------------------
np: 4                  # MPI ranks for pw.x / ph.x
omp_num_threads: 1
mpi_command: mpirun

# --- Directories -----------------------------------------------------------
outdir: runs           # project run dir (inputs, logs, CSV, plots, report)
qe_outdir: ./tmp       # QE scratch dir written into pw.x/ph.x &CONTROL
